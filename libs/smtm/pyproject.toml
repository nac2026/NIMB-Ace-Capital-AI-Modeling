[project]
name = "nrc-smtm"
version = "0.1.0"
description = "SMTM Data API client — live NEPSE feed (auth, floorsheet, quotes, indices, company list)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nrc-contracts",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_smtm"]
