[project]
name = "nrc-contracts"
version = "0.1.0"
description = "Shared Pydantic schemas (Quote, OHLCV, Fundamentals, NewsArticle, QueryTrace)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8",
  "python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_contracts"]
