[project]
name = "nrc-notifications"
version = "0.1.0"
description = "Email alert delivery — SMTP sender, settings and templates for speculation alerts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_notifications"]
