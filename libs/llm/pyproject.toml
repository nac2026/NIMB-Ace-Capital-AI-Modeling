[project]
name = "nrc-llm"
version = "0.1.0"
description = "LLM provider abstraction — Vertex Gemini today, Claude-on-Vertex later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nrc-contracts",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "google-genai>=0.8",
  "tenacity>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_llm"]
