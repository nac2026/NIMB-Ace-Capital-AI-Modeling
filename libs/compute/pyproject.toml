[project]
name = "nrc-compute"
version = "0.1.0"
description = "ComputeEngine abstraction — DuckDB (local) / Spark (prod)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nrc-contracts",
  "nrc-storage",
  "duckdb>=1.1",
  "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_compute"]
