[project]
name = "nrc-tools"
version = "0.1.0"
description = "Deterministic research tools — the functions the LLM calls"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nrc-contracts",
  "nrc-storage",
  "pydantic>=2.7",
  "sqlglot>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_tools"]
