[project]
name = "nrc-processing"
version = "0.1.0"
description = "Bronze → Silver → Gold processing transforms (orchestrated by nrc-pipelines / Dagster)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "nrc-contracts",
  "nrc-nepal",
  "nrc-storage",
  "nrc-compute",
  "nrc-ingestion",
  "nrc-notifications",
  "duckdb>=1.1",
  "pyarrow>=15",
  "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_processing"]

[project.scripts]
nrc-process = "nrc_processing.cli:app"
