[project]
name = "nrc-ingestion"
version = "0.1.0"
description = "Scrape → Bronze ingestion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nrc-contracts",
  "nrc-nepal",
  "nrc-storage",
  "nrc-smtm",
  "duckdb>=1.1",
  "pyarrow>=15",
  "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_ingestion"]

[project.scripts]
nrc-ingest = "nrc_ingestion.cli:app"
nrc-scrape = "nrc_ingestion.scrape_cli:app"
