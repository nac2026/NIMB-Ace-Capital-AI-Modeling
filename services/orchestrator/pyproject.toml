[project]
name = "nrc-orchestrator"
version = "0.1.0"
description = "LLM agent loop + FastAPI chat endpoint"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nrc-contracts",
  "nrc-storage",
  "nrc-tools",
  "nrc-llm",
  "nrc-processing",
  "nrc-notifications",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pymupdf>=1.24",
  "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_orchestrator"]

[project.scripts]
nrc-ask = "nrc_orchestrator.cli:app"
nrc-serve = "nrc_orchestrator.server:main"
