[project]
name = "nrc-ui"
version = "0.1.0"
description = "Streamlit demo UI for the NEPSE Research Copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.36",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_ui"]
