[project]
name = "nrc-pipelines"
version = "0.1.0"
description = "Dagster orchestration for the NEPSE lakehouse — Bronze/Silver/Gold assets, jobs, schedules."
requires-python = ">=3.12,<3.13"
dependencies = [
  "nrc-contracts",
  "nrc-ingestion",
  "nrc-processing",
  "nrc-storage",
  "nrc-newsfeed",
  "dagster>=1.9,<2.0",
  "dagster-webserver>=1.9,<2.0",
  # dbt for Gold-layer analytics models. dagster-dbt integrates the two —
  # every dbt model becomes a Dagster asset with its Silver upstream
  # auto-wired via ref()/source() lineage.
  "dagster-dbt>=0.25,<1.0",
  "dbt-core>=1.8,<1.10",
  "dbt-duckdb>=1.8,<1.10",
  "deltalake>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nrc_pipelines"]

[tool.dagster]
# Module-based discovery: `dagster dev -m nrc_pipelines` loads the Definitions
# object from nrc_pipelines/definitions.py.
module_name = "nrc_pipelines.definitions"
code_location_name = "nrc_pipelines"
